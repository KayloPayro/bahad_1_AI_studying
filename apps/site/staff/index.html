<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>מעקב סגל · לומדות AI</title>
    <link rel="manifest" href="%SITE_BASE%manifest.webmanifest" />
    <link rel="icon" href="%SITE_BASE%icons/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lumda.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>העמוד צריך JavaScript.</noscript>
    <script type="module" src="../src/staff.tsx"></script>
  </body>
</html>
