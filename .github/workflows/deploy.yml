name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Linux native binaries (lockfile was made on Windows)
        run: npm install --no-save --no-package-lock @rolldown/binding-linux-x64-gnu@1.2.19 lightningcss-linux-x64-gnu@1.33.0 @esbuild/linux-x64@0.28.2 @rollup/rollup-linux-x64-gnu@4.68.5
      - run: npm run validate
      - name: Build site and all modules
        run: npm run build:all
        env:
          # Project pages live under /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
